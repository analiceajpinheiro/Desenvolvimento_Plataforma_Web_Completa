name: CI/CD Pipeline - VitaLink

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== BACKEND TESTS =====
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalink_test

      - name: Executar testes unitários
        working-directory: ./backend
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalink_test
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test

      - name: Upload cobertura de código (backend)
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: ignore

  # ===== FRONTEND TESTS =====
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Executar testes unitários
        working-directory: ./frontend
        run: npm test -- --run
        env:
          CI: true

      - name: Build do frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3333/api

      - name: Upload artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: ignore

  # ===== CODE QUALITY =====
  code-quality:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalink_test

      - name: Verificar TypeScript (backend)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Verificar TypeScript (frontend)
        working-directory: ./frontend
        run: npx tsc --noEmit

  # ===== SONARCLOUD ANALYSIS =====
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalink_test

      - name: Gerar cobertura do backend
        working-directory: ./backend
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalink_test
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Gerar cobertura do frontend
        working-directory: ./frontend
        run: npm test -- --run --coverage
        env:
          CI: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
